<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- 자바스크립트 인라인 사용 전 -->
<script>

    //이렇게 하면 문법이 안맞는다...
    //username = userA 이렇게 되기 때문에...
    var username = [[${user.username}]];
    var age = [[${user.age}]];

    //자바스크립트 내추럴 템플릿
    //인라인에서는 주석처리된 부분을 사용할 수 있다. 렌더링 되었을 때.
    var username2 = /*[[${user.username}]]*/ "test username";

    //객체
    var user = [[${user}]];
</script>
<!--
자바스크립트 인라인 사용 후
타임리프가 도와준다.
-->
<script th:inline="javascript">
    var username = [[${user.username}]]; //username = "userA";
    var age = [[${user.age}]];
    //자바스크립트 내추럴 템플릿
    //렌더링되면 userA를 넣고, 그렇지 않을 때는 test username이 사용된다.
    var username2 = /*[[${user.username}]]*/ "test username";
    //객체
    var user = [[${user}]];
</script>

<!-- 자바스크립트 인라인 each -->
<script th:inline="javascript">
    [# th:each="user, stat : ${users}"]
    var user[[${stat.count}]] = [[${user}]];
    [/]
//        var user1 = {json 형태};
//        var user2 = {json 형태};
    //이렇게 여러 변수를 한번에 객체형태로 지원한다.
</script>

</body>
</html>
